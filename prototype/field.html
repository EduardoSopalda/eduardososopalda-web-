<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Eduardo Sopalda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..600,50,1;1,9..144,300..500,50,1&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{
  --void:#000000; --flesh:#E3AF95; --bone:#F3EBE0; --gold:#F7C56A;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --display:'Fraunces',Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--void);color:var(--bone);font-family:var(--display);
  -webkit-font-smoothing:antialiased;cursor:crosshair;touch-action:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

#field{position:fixed;inset:0;z-index:1}
#world{opacity:0;transition:opacity 2.6s ease}
body[data-state="field"] #world{opacity:1}
#world{position:fixed;inset:0;z-index:2;pointer-events:none}
#glow{position:fixed;z-index:3;pointer-events:none;width:150vmax;height:150vmax;left:0;top:0;
  margin-left:-75vmax;margin-top:-75vmax;mix-blend-mode:screen;
  background:radial-gradient(closest-side,rgba(247,197,106,.085),rgba(120,70,40,.035) 42%,rgba(0,0,0,0) 72%);
  will-change:transform}

/* ---------- specimens ---------- */
.spec{position:absolute;top:0;left:0;pointer-events:auto;line-height:0;will-change:transform}
.spec img{display:block;width:100%;height:auto;transition:filter 1.1s cubic-bezier(.2,.7,.2,1)}
.spec[data-fam="void"] img{filter:brightness(.60) contrast(1.24) saturate(.85)}
.spec[data-fam="lit"] img{filter:brightness(.42) contrast(1.02) saturate(.7)}
.spec[data-awake="1"][data-fam="void"] img{filter:brightness(1) contrast(1.22) saturate(1)}
.spec[data-awake="1"][data-fam="lit"] img{filter:brightness(1) contrast(1.04) saturate(1)}

/* ---------- fragments ---------- */
.frag{position:absolute;top:0;left:0;white-space:nowrap;pointer-events:auto;cursor:pointer;
  font-family:var(--display);font-weight:400;font-variation-settings:'SOFT' 50,'WONK' 1;
  will-change:transform}
.frag i{display:inline-block;font-style:normal;will-change:transform,opacity}
.frag.es{font-style:italic}

/* ---------- nerve stops ---------- */
.stop{position:absolute;top:0;left:0;pointer-events:auto;cursor:pointer;
  font-family:var(--mono);font-size:10px;letter-spacing:.34em;text-transform:uppercase;
  color:rgba(243,235,224,.3);white-space:nowrap;transition:color .5s,letter-spacing .8s cubic-bezier(.2,.7,.2,1);
  transform-origin:0 50%}
.stop[data-near="1"]{color:var(--gold);letter-spacing:.52em}

/* ---------- hud ---------- */
#mark{position:fixed;z-index:6;left:50%;top:38%;transform:translate(-50%,-50%);text-align:center;
  transition:transform 2.2s cubic-bezier(.6,0,.2,1),font-size 2.2s cubic-bezier(.6,0,.2,1)}
#mark .n{display:block;font-family:var(--display);font-weight:400;font-size:clamp(34px,6.4vw,86px);
  line-height:1;letter-spacing:-.02em;transition:font-size 2.2s cubic-bezier(.6,0,.2,1)}
#mark .t{display:block;margin-top:.55rem;font-family:var(--display);font-style:italic;
  font-size:clamp(14px,1.7vw,23px);color:rgba(227,175,149,.8);letter-spacing:.02em;
  transition:font-size 2.2s cubic-bezier(.6,0,.2,1),opacity 1.2s}
body[data-state="field"] #mark{left:clamp(18px,3vw,40px);top:clamp(20px,3.4vh,38px);transform:none;text-align:left}
body[data-state="field"] #mark .n{font-size:clamp(15px,1.5vw,19px);letter-spacing:.01em}
body[data-state="field"] #mark .t{font-size:clamp(11px,1vw,13px);margin-top:.2rem}

#purpose{position:fixed;z-index:6;left:50%;top:56%;transform:translateX(-50%);
  font-family:var(--display);font-size:clamp(14px,1.5vw,20px);color:rgba(243,235,224,.9);
  text-align:center;white-space:nowrap;transition:all 2.2s cubic-bezier(.6,0,.2,1)}
body[data-state="field"] #purpose{left:clamp(18px,3vw,40px);top:auto;bottom:clamp(20px,3.4vh,38px);
  transform:none;font-size:clamp(11.5px,1.05vw,14px);color:rgba(243,235,224,.62)}

#meta{position:fixed;z-index:6;right:clamp(18px,3vw,40px);bottom:clamp(20px,3.4vh,38px);
  font-family:var(--mono);font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;
  color:rgba(227,175,149,.35);text-align:right;line-height:2;opacity:0;transition:opacity 1.4s}
body[data-state="field"] #meta{opacity:1}
#meta a{color:inherit;text-decoration:none;border-bottom:1px solid rgba(227,175,149,.25)}
#meta a:hover{color:var(--gold)}

#room{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.94);backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:opacity .7s}
#room[data-open="1"]{opacity:1;pointer-events:auto}
#room .in{text-align:center;max-width:34ch}
#room h2{font-family:var(--display);font-weight:400;font-size:clamp(30px,5vw,64px);letter-spacing:-.02em}
#room p{margin-top:1.2rem;font-family:var(--mono);font-size:10.5px;letter-spacing:.28em;
  text-transform:uppercase;color:rgba(227,175,149,.55);line-height:2.2}
#room button{margin-top:2.2rem;font-family:var(--mono);font-size:10px;letter-spacing:.3em;
  text-transform:uppercase;color:var(--gold)}
</style>
</head>

  world.appendChild(el);
  return {el,s,xn:(i+.5)/SPECS.length + (((i*67)%140)-70)/4200,
          breathe:Math.random()*6.28, awake:0, sx:0, sy:0, vis:false};
});

/* ---------- build fragments ---------- */
const frags=FRAGS.map((f,i)=>{
  const el=document.createElement('div'); el.className='frag'+(f[1]?' es':'');
  const chars=[...f[0]].map(ch=>{
    const s=document.createElement('i'); s.textContent = ch===' '?'\u00A0':ch; el.appendChild(s); return s;
  });
  world.appendChild(el);
  const depth=.30+((i*17)%6)*.13;
  return {el,chars,text:f[0],
    xn:(i+.5)/FRAGS.length + (((i*91)%260)-130)/4200,
    y:.10+((i*37)%100)/100*.76,
    depth, size:13+ (1-Math.abs(depth-.7))*13,
    life:0, state:'alive', held:0, decay:0,
    parts:chars.map(()=>({x:0,y:0,vx:0,vy:0,o:1})), vis:false};
});

/* ---------- build nerve stops ---------- */
const stops=STOPS.map((s,i)=>{
  const el=document.createElement('div'); el.className='stop'; el.textContent=s[0];
  world.appendChild(el);
  el.addEventListener('click',()=>openRoom(i));
  return {el,name:s[0],note:s[1],xn:(i+.5)/STOPS.length, near:0, sx:0, sy:0};
});

/* ============================ input ============================ */
addEventListener('pointermove',e=>{px=e.clientX;py=e.clientY;hasPointer=true;});
addEventListener('pointerleave',()=>{hasPointer=false;px=-9999;py=-9999;});
addEventListener('wheel',e=>{ targetX+=(Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY)*1.1; },{passive:true});
let drag=false,lx=0,ly=0,dragY=0;
addEventListener('pointerdown',e=>{ if(e.target.closest('button,.stop'))return; drag=true; lx=e.clientX; ly=e.clientY; });
addEventListener('pointerup',()=>drag=false);
addEventListener('pointermove',e=>{ if(drag){ targetX-=(e.clientX-lx)*1.7; dragY=Math.max(-H*.34,Math.min(H*.34,dragY+(e.clientY-ly)*.9)); lx=e.clientX; ly=e.clientY; }});

/* ============================ rooms ============================ */
const room=document.getElementById('room');
function openRoom(i){
  document.getElementById('r-title').textContent=STOPS[i][0];
  document.getElementById('r-note').textContent=STOPS[i][1]+' · not built yet';
  room.dataset.open='1';
}
document.getElementById('r-back').onclick=()=>room.dataset.open='0';
addEventListener('keydown',e=>{ if(e.key==='Escape') room.dataset.open='0'; });
document.getElementById('li').onclick=e=>e.preventDefault();

/* the wordmark walks to the corner once the field is alive */
function begin(){ if(document.body.dataset.state==='field')return;
  document.body.dataset.state='field'; started=performance.now(); }
setTimeout(begin, 3400);
addEventListener('pointermove',()=>begin(),{once:true});
addEventListener('wheel',()=>begin(),{once:true,passive:true});

/* ============================ nerve ============================ */
function nerveY(x,time){
  const base=H*.55 + worldYoff;
  let c=0;
  if(hasPointer){ const d=Math.abs(x-px); if(d<360){ const f=1-d/360; c=(py-base)*f*f*.5; } }
  return base + Math.sin(x*.0015+time*.30)*H*.07 + Math.sin(x*.0039-time*.19)*H*.028 + c;
}
const pulses=[{p:.05,s:.0013},{p:.44,s:.0009},{p:.78,s:.0018}];

/* ============================ loop ============================ */
const DECAY_AFTER=40;     // seconds alone before a fragment comes apart
const DECAY_TIME=10;      // seconds to fall

function frame(){
  const dt=REDUCE?0:1/60;
  t+=dt;

  if(!drag) targetX += REDUCE?0:0.34;
  worldX += (targetX-worldX)*0.06;
  // the field also rises and falls, on a period that never divides into the loop
  worldYoff = dragY + (REDUCE?0:Math.sin(t*0.0817)*H*0.16);

  ctx.clearRect(0,0,W,H);
  glowEl.style.transform='translate3d('+(hasPointer?px:W/2).toFixed(0)+'px,'+(hasPointer?py:H/2).toFixed(0)+'px,0)';

  /* ---- specimens ---- */
  nodes.forEach(n=>{
    const w=n.s.w*SC;
    const X=wrap(n.xn*WORLD_W-worldX*n.s.d, WORLD_W)-Math.min(520,W*.4);
    const Y=n.s.y*H - w*.3 + worldYoff*n.s.d;
    n.sx=X+w*.5; n.sy=Y+w*.28;
    const on = X>-(w+300) && X<W+300 && Y>-w && Y<H+w;
    n.vis=on; n.el.style.visibility=on?'visible':'hidden';
    if(!on) return;
    let want=0, lxx=0, lyy=0;
    if(hasPointer){
      const dx=px-n.sx, dy=py-n.sy, d=Math.hypot(dx,dy)||1;
      want = d<w*.62 ? 1 : 0;
      if(d<w*1.2){ const f=1-d/(w*1.2); lxx=dx/d*f*f*14; lyy=dy/d*f*f*9; }
    }
    n.awake += (want-n.awake)*.1;
    n.el.dataset.awake = n.awake>.5?'1':'0';
    const br = REDUCE?1:1+Math.sin(t*.6+n.breathe)*.014;
    const bob= REDUCE?0:Math.sin(t*.42+n.breathe*1.7)*8;
    n.el.style.width=w+'px';
    n.el.style.zIndex=String(Math.round(n.s.d*100));
    n.el.style.transform='translate3d('+(X+lxx).toFixed(1)+'px,'+(Y+bob+lyy).toFixed(1)+'px,0) scale('+(br*(1+n.awake*.02)).toFixed(4)+')';
    n.el.style.opacity=String(.4+n.s.d*.6);
  });

  /* ---- fragments: they live while something is near, and come apart when nothing is ---- */
  frags.forEach(f=>{
    const X=wrap(f.xn*FRAG_W-worldX*f.depth, FRAG_W)-Math.min(520,W*.4);
    const Y=f.y*H + worldYoff*f.depth;
    const on = X>-700 && X<W+400 && Y>-120 && Y<H+120;
    f.vis=on; f.el.style.visibility=on?'visible':'hidden';
    if(!on){ if(f.state==='gone'){ respawn(f); } return; }

    f.el.style.fontSize=(f.size*SC).toFixed(1)+'px';
    f.el.style.color='rgba(243,235,224,'+(0.16+f.depth*0.34).toFixed(3)+')';

    // proximity is context: near the cursor, the words hold
    let near=false;
    if(hasPointer){
      const dx=px-(X+f.el.offsetWidth*.5), dy=py-Y;
      near = Math.hypot(dx,dy) < 260;
    }
    if(f.state==='alive'){
      if(near){ f.life=Math.max(0,f.life-dt*2.5); f.held=1; }
      else { f.life+=dt; f.held=0; }
      if(f.life>DECAY_AFTER){ f.state='decay'; f.decay=0;
        f.parts.forEach((p,i)=>{ p.vx=(Math.random()-.5)*14; p.vy=6+Math.random()*22; p.x=0; p.y=0; p.o=1; });
      }
      f.el.style.transform='translate3d('+X.toFixed(1)+'px,'+Y.toFixed(1)+'px,0)';
      f.el.style.opacity=String(near?1:(0.30+f.depth*0.42));
      f.chars.forEach(c=>{ c.style.transform=''; c.style.opacity=''; });
    }
    else if(f.state==='decay'){
      f.decay+=dt;
      const ny=nerveY(X+f.el.offsetWidth*.5,t);
      f.parts.forEach((p,i)=>{
        p.vy += (ny-(Y+p.y))*0.0016;      // the letters fall toward the nerve
        p.x  += p.vx*dt*7;
        p.y  += p.vy*dt*7;
        p.o   = Math.max(0,1-(f.decay/DECAY_TIME));
        const c=f.chars[i];
        c.style.transform='translate('+p.x.toFixed(1)+'px,'+p.y.toFixed(1)+'px)';
        c.style.opacity=p.o.toFixed(3);
      });
      f.el.style.transform='translate3d('+X.toFixed(1)+'px,'+Y.toFixed(1)+'px,0)';
      if(f.decay>DECAY_TIME){ f.state='gone'; f.el.style.visibility='hidden'; }
    }
  });
  function respawn(f){
    f.state='alive'; f.life=0; f.decay=0;
    f.xn = wrap(f.xn + .28 + Math.random()*.3, 1);
    f.y  = .10+Math.random()*.76;
    f.chars.forEach(c=>{ c.style.transform=''; c.style.opacity=''; });
  }

  /* ---- the nerve ---- */
  ctx.lineCap='round';
  ctx.beginPath();
  for(let x=-20;x<=W+20;x+=8){ const y=nerveY(x,t); x===-20?ctx.moveTo(x,y):ctx.lineTo(x,y); }
  ctx.strokeStyle='rgba(227,175,149,0.17)'; ctx.lineWidth=1; ctx.stroke();

  if(!REDUCE) pulses.forEach(p=>{
    p.p+=p.s; if(p.p>1.2) p.p=-.2;
    const cx=p.p*W;
    ctx.beginPath();
    for(let x=cx-100;x<=cx+100;x+=6){ if(x<-20||x>W+20)continue; ctx.lineTo(x,nerveY(x,t)); }
    const gr=ctx.createLinearGradient(cx-100,0,cx+100,0);
    gr.addColorStop(0,'rgba(247,197,106,0)'); gr.addColorStop(.5,'rgba(247,197,106,.9)'); gr.addColorStop(1,'rgba(247,197,106,0)');
    ctx.strokeStyle=gr; ctx.lineWidth=1.6; ctx.stroke();
  });

  /* ---- the seven stops, riding the nerve ---- */
  stops.forEach(s=>{
    const X=wrap(s.xn*WORLD_W-worldX, WORLD_W)-Math.min(520,W*.4);
    const on = X>-240 && X<W+120;
    s.el.style.visibility=on?'visible':'hidden';
    if(!on) return;
    const y=nerveY(X,t);
    s.sx=X; s.sy=y;
    let n=0;
    if(hasPointer){ const d=Math.hypot(px-X,py-y); n = d<150?1:0; }
    s.near += (n-s.near)*.14;
    s.el.dataset.near = s.near>.5?'1':'0';
    s.el.style.transform='translate3d('+X.toFixed(1)+'px,'+(y-26-s.near*10).toFixed(1)+'px,0)';
    // the bead on the line
    ctx.beginPath(); ctx.arc(X,y,3+s.near*3,0,6.29);
    ctx.fillStyle='rgba(247,197,106,'+(0.45+s.near*0.55).toFixed(2)+')'; ctx.fill();
    if(s.near>0.02){
      ctx.beginPath(); ctx.moveTo(X,y); ctx.lineTo(X,y-22);
      ctx.strokeStyle='rgba(247,197,106,'+(0.5*s.near).toFixed(2)+')'; ctx.lineWidth=1; ctx.stroke();
    }
  });

  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
